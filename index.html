<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/jpg" href="Images/logo app 2.jpg">
    <title>RICH APP</title>
    <link rel="stylesheet" href="styles/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        // Check if user is already logged in via sessionStorage
        // If logged in, redirect to main_UI, otherwise show login page
        (function() {
            const userEmail = sessionStorage.getItem('user_email') || localStorage.getItem('user_email');
            if (userEmail) {
                // User is logged in, redirect to main UI
                window.location.href = 'main_UI.html';
            }
            // If no sessionStorage, show login page (do nothing, let page load)
        })();
    </script>
    <style>
        /* Full-screen loading screen shown before the login-card becomes visible */
        #loadingOverlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            z-index: 9999;
            animation: overlayFadeOut 4s ease forwards;
        }

        #loadingOverlay .rotating-circle {
            /* Match height with the text image for perfect vertical alignment */
            width: 140px;
            height: 140px;
            /* Shrink near the end; position stays centered (scale only). */
            animation: shrinkCircleToNothing 0.8s ease forwards;
            animation-delay: 3.2s;
        }

        #loadingOverlay .loading-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 28px;
            flex-wrap: nowrap;
        }

        #loadingOverlay .rotating-circle .spin {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: rotate 3s linear infinite;
        }

        #loadingOverlay .rotating-circle .circle-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        #loadingOverlay .no-bg-logo {
            /* Base size while loading */
            height: 100px;
            width: auto;
            max-width: 220px;
            object-fit: contain;
            transform-origin: center center;
            /* Slower, continuous smooth growth (ease-in-out) */
            animation: growTextAndShiftLeft 2.4s ease-in-out forwards;
            animation-delay: 1.8s;
        }

        /* Login card fades in after loading overlay is gone */
        #mainContent {
            opacity: 0;
            visibility: hidden;
            animation: loginContentFadeIn 0.6s ease-out forwards;
            animation-delay: 4s;
        }

        @keyframes overlayFadeOut {
            0% { opacity: 1; visibility: visible; pointer-events: auto; }
            98% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; pointer-events: none; }
        }

        @keyframes loginContentFadeIn {
            0% { opacity: 0; visibility: hidden; }
            100% { opacity: 1; visibility: visible; }
        }

        @keyframes shrinkCircleToNothing {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0); opacity: 0; }
        }

        @keyframes growTextAndShiftLeft {
            0% { transform: translateX(0) scale(1); }
            100% { transform: translateX(-95px) scale(3.1); }
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div id="loadingOverlay" aria-label="Loading">
        <div class="loading-row">
            <div class="rotating-circle">
                <div class="spin">
                    <img class="circle-image" src="Images/cricle-removebg.png" alt="Loading Circle">
                </div>
            </div>
                <img class="no-bg-logo" src="Images/text-removebg.png" alt="RICH Text">
        </div>
    </div>

    <!-- Main Content -->
    <div id="mainContent" class="main-content">
        <div class="container">
            <div class="login-card">
                <!-- Header -->
                <div class="header">
                    <h1 class="welcome-text">Hello, Welcome!</h1>
                    <p class="app-name">Login to <span class="egov">RICH</span><span class="ph"> Bigte</span></p>
                </div>

                <!-- Login Forms -->
                <div class="forms-container">
                    <!-- Email Login Form -->
                    <form id="emailForm" class="login-form active">
                        <div class="input-group">
                            <input type="email" id="email" placeholder="Email Address" required>
                        </div>
                        <button type="submit" class="login-btn">Login</button>
                    </form>
                </div>

                <!-- Separator -->
                <div class="separator">
                    <div class="line"></div>
                    <span class="or-text">or</span>
                    <div class="line"></div>
                </div>

                <!-- Create Account -->
                <div class="create-account">
                    <p class="account-text">Don't have RICH account yet?</p>
                    <button class="create-btn">Create new account</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/login.js?v=20261028"></script>
</body>
</html>
